[package]
name = "zqa-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Native GUI front-end for the zqa Zotero RAG QA system."

[[bin]]
name = "zqa-gui"
path = "src/main.rs"

[dependencies]
zqa = { path = "../zqa", version = "0.1" }
zqa-rag = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
futures = "0.3"
gpui-kit = "0.6"
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui-kit = { version = "0.6", features = ["test-support"] }
zqa-macros = { workspace = true }
zqa-rag = { workspace = true, features = ["mock"] }
