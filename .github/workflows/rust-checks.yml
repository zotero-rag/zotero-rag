name: Rust Checks
permissions:
  contents: read

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    
    steps:
    - name: Dependencies
      # protobuf-compiler is for the zqa-rag build; the rest are GPUI's Linux system
      # dependencies needed to compile zqa-gui (font-kit/fontconfig plus the x11/wayland
      # display backends). See zqa-gui/README.md.
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler \
          clang libfontconfig-dev libwayland-dev \
          libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev libvulkan1

    - uses: rui314/setup-mold@v1

    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy
        override: true
        
    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo index
      uses: actions/cache@v5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Check formatting
      run: cargo fmt --all -- --check
      
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Check dependencies (advisories, licenses, bans, sources)
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check
