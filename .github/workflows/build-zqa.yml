name: Build zqa
permissions:
  contents: read

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**/README.md'
      - 'wiki/**'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**/*.md'
      - 'wiki/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.98.1

    - name: Dependencies
      # protobuf-compiler is for the zqa-rag build; the rest are GPUI's Linux system
      # dependencies needed to compile zqa-gui (font-kit/fontconfig plus the x11/wayland
      # display backends). See zqa-gui/README.md.
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler \
          clang libfontconfig-dev libwayland-dev \
          libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev libvulkan1

    - uses: rui314/setup-mold@v1

    - uses: actions/checkout@v6

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

    - name: Run tests
      run: RUST_BACKTRACE=1 cargo test -p zqa -p zqa-gui --verbose -- --nocapture
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_KEY }}
        VOYAGE_AI_API_KEY: ${{ secrets.VOYAGE_AI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        OPENROUTER_MODEL: openai/gpt-6-luna
        ANTHROPIC_MODEL: claude-haiku-4-5-20251001
        OPENAI_MODEL: gpt-6-luna
        VOYAGE_AI_MODEL: voyage-4-lite
        OPENAI_EMBEDDING_MODEL: text-embedding-3-small
        MAX_CONCURRENT_REQUESTS: 5
